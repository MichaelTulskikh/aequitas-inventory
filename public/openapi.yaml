openapi: 3.0.3
info:
  title: WMS API
  version: "V2"
  description: |
    Aequitas Inventory Management API

servers:
  - url: https://ts6by35hd4.execute-api.eu-north-1.amazonaws.com
    description: API Gateway

tags:
  - name: Health
  - name: Dashboard v2
  - name: Catalog Meta v2
  - name: Inbound Shipments v2
  - name: Inventory Audit v2
  - name: Inventory v2
  - name: Inventory Valuation v2
  - name: Item Catalog v2
  - name: Locations Admin v2
  - name: Requester Profile v2
  - name: Requester Profiles Admin v2
  - name: Shipments v2
  - name: Shipment Lines v2
  - name: System Settings v2

components:
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Resource identifier
      schema:
        type: string

  responses:
    DefaultSuccess:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Unauthorized:
      description: Unauthorized
    Forbidden:
      description: Forbidden
    NotFound:
      description: Resource not found

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Service and dependency health
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  version:
                    type: string
                  environment:
                    type: string
                  region:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  uptimeSeconds:
                    type: integer
                  requestId:
                    type: string
                    nullable: true
                  checks:
                    type: object
                    properties:
                      api:
                        type: object
                        properties:
                          ok:
                            type: boolean
                      db:
                        type: object
                        properties:
                          ok:
                            type: boolean
                          database:
                            type: string
                          user:
                            type: string
                          postgresVersion:
                            type: string
                          serverTime:
                            type: string
                            format: date-time
        "503":
          description: Dependency unhealthy
          content:
            application/json:
              schema:
                type: object

  /api/v2/dashboard:
    get:
      tags: [Dashboard v2]
      summary: Get dashboard summary
      security:
        - cognitoJwt: []
      responses:
        "200":
          $ref: "#/components/responses/DefaultSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

